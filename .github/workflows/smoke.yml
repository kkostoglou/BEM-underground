name: Python smoke checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python -m compileall -q src/python
      - run: python -c "import numpy, scipy, matplotlib; from python.case_catalog import project_root; assert (project_root() / 'examples/in/In-5.27-LD.DAT').is_file()"
      - run: python -m python --help
